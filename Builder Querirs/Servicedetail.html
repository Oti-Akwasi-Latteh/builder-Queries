<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Service Detail – BuilderQueries</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./Css/Shared.css" />
  <link rel="stylesheet" href="./Css/Servicedetail.css" />
</head>
<body data-page="home" class="page-body">

  <!-- ═══ NAV ═══ -->
  <nav class="dash-nav">
    <a class="dash-logo" href="index.html">Builder<span>Queries</span></a>
    <div class="page-tabs">
      <a class="tab-btn" data-page="home"     href="Dashboard.html">Services</a>
      <a class="tab-btn" data-page="projects" href="project.html">Projects</a>
      <a class="tab-btn" data-page="about"    href="About.html">About</a>
      <a class="tab-btn" data-page="contact"  href="Contact.html">Contact Us</a>
    </div>
    <div class="user-pill" id="user-pill" onclick="toggleMenu(event)" role="button" aria-haspopup="true" aria-expanded="false" tabindex="0">
      <div class="avatar" id="user-avatar">JD</div>
      <span class="user-name" id="user-display">John D.</span>
      <svg class="pill-chevron" id="pill-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="pop-menu" id="pop-menu" role="menu">
      <div class="pop-menu-header">
        <div class="pop-avatar-lg" id="pop-avatar-lg">JD</div>
        <div><div class="pop-name" id="pop-name">John D.</div><div class="pop-email" id="pop-email">user@example.com</div></div>
      </div>
      <div class="pop-divider"></div>
      <button class="pop-item" onclick="openSettings()" role="menuitem">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </button>
      <button class="pop-item pop-item--toggle" onclick="toggleDarkMode()" role="menuitem" id="dark-mode-item">
        <span class="dm-icon-wrap">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
        <span id="dark-mode-label">Dark Mode</span>
        <div class="toggle-switch" id="dark-toggle"><div class="toggle-knob"></div></div>
      </button>
      <div class="pop-divider"></div>
      <button class="pop-item pop-item--danger" onclick="handleLogout()" role="menuitem">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Log Out
      </button>
    </div>
  </nav>

  <!-- ═══ SERVICE HERO ═══ -->
  <div class="service-detail-hero">
    <a class="back-btn" href="Dashboard.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Services
    </a>
    <div class="svc-hero-inner">
      <div class="svc-hero-icon" id="svc-hero-icon">🏗️</div>
      <div>
        <h2 id="svc-hero-title">Loading…</h2>
        <p id="svc-hero-count" class="svc-hero-sub"></p>
      </div>
    </div>
  </div>

  <!-- ═══ CONTENT ═══ -->
  <div class="dash-content">
    <div class="svc-filters">
      <div class="filter-group">
        <label>Sort by</label>
        <select id="svc-sort" onchange="renderServiceContractors()">
          <option value="rating">Highest Rated</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="reviews">Most Reviews</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Location</label>
        <select id="svc-location" onchange="renderServiceContractors()">
          <option value="">All Locations</option>
          <option>Accra</option>
          <option>Kumasi</option>
          <option>Takoradi</option>
          <option>Tamale</option>
        </select>
      </div>
    </div>
    <div class="contractors-grid" id="contractors-grid"></div>
  </div>

  <footer class="dash-footer">© 2026 <strong>BuilderQueries</strong> · All rights reserved</footer>

  <!-- ═══ SETTINGS MODAL ═══ -->
  <div class="modal-overlay" id="settings-modal" onclick="closeSettingsOutside(event)">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Account Settings</h3>
        <button class="modal-close" onclick="closeSettings()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="profile-img-section">
        <div class="profile-img-wrap" id="profile-img-wrap" onclick="document.getElementById('img-upload').click()">
          <img id="profile-img" src="" alt="" style="display:none;" />
          <div class="profile-img-initials" id="profile-img-initials">JD</div>
          <div class="profile-img-overlay"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg><span>Change</span></div>
        </div>
        <input type="file" id="img-upload" accept="image/*" style="display:none;" onchange="handleImageUpload(event)" />
        <p class="img-hint">Click to upload a profile photo</p>
      </div>
      <div class="modal-field"><label for="settings-name">Display Name</label><input type="text" id="settings-name" placeholder="Enter your display name" /></div>
      <div class="modal-field"><label for="settings-email">Email</label><input type="email" id="settings-email" placeholder="your@email.com" /></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
        <button class="btn-save" onclick="saveSettings()">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- ═══ BOOKING MODAL ═══ -->
  <div class="modal-overlay" id="booking-modal" onclick="if(event.target===this)closeBookingModal()">
    <div class="modal-card modal-card--wide">
      <div class="modal-header">
        <h3>Book a Contractor</h3>
        <button class="modal-close" onclick="closeBookingModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="booking-pro-info" id="booking-pro-info"></div>
      <div class="modal-field"><label for="bk-name">Your Name</label><input type="text" id="bk-name" placeholder="e.g. Kofi Mensah" /></div>
      <div class="modal-field"><label for="bk-email">Your Email</label><input type="email" id="bk-email" placeholder="you@email.com" /></div>
      <div class="modal-field"><label for="bk-date">Preferred Date</label><input type="date" id="bk-date" /></div>
      <div class="modal-field"><label for="bk-time">Preferred Time</label>
        <select id="bk-time">
          <option>Morning (8am – 12pm)</option>
          <option>Afternoon (12pm – 4pm)</option>
          <option>Evening (4pm – 7pm)</option>
        </select>
      </div>
      <div class="modal-field"><label for="bk-desc">Project Description</label><textarea id="bk-desc" rows="3" placeholder="Briefly describe the work needed…"></textarea></div>
      <div class="modal-field">
        <label for="bk-location">Your Location (town/city)</label>
        <div style="display:flex;gap:0.5rem;">
          <input type="text" id="bk-location" placeholder="e.g. East Legon, Accra" style="flex:1;" />
          <button type="button" class="btn-cancel" id="bk-locate-btn" onclick="useMyLocation()" style="white-space:nowrap;">📍 Use my location</button>
        </div>
        <p id="bk-location-status" style="font-size:0.78rem;color:var(--text-secondary);margin-top:0.35rem;"></p>
      </div>
      <div class="admin-form-row" style="display:flex;gap:0.75rem;">
        <div class="modal-field" style="flex:1;"><label for="bk-lat">Latitude <span style="font-weight:400;color:var(--text-secondary);">(optional)</span></label><input type="text" id="bk-lat" placeholder="6.6885" /></div>
        <div class="modal-field" style="flex:1;"><label for="bk-lng">Longitude <span style="font-weight:400;color:var(--text-secondary);">(optional)</span></label><input type="text" id="bk-lng" placeholder="-1.6244" /></div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeBookingModal()">Cancel</button>
        <button class="btn-save" id="bk-submit-btn" onclick="submitBooking()">Confirm Booking</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"><span class="check">✓</span><span id="toast-msg"></span></div>

  <script src="./js/Nav.js"></script>
  <script src="./js/Servicedetail.js"></script>
</body>
</html>
