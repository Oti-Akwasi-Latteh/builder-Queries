<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – BuilderQueries</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./Css/Login.css">
</head>
<body>

<!-- ═══════════════════════ RESET PASSWORD PAGE ═══════════════════════ -->
<div id="page-reset" class="page">
  <span class="auth-logo">Builder<span>Queries</span></span>
  <div class="auth-card">
    <span class="back-link" onclick="window.location.href='Login.html'">← Back to login</span>
    <h2>Set a new password</h2>
    <p class="auth-sub" id="reset-sub">Choose a new password for your account.</p>

    <div id="reset-form">
      <div class="form-group">
        <label>New password</label>
        <input type="password" placeholder="At least 6 characters" id="reset-pass" />
      </div>
      <div class="form-group">
        <label>Confirm new password</label>
        <input type="password" placeholder="Re-enter your new password" id="reset-pass-confirm" />
      </div>

      <button class="btn-submit" id="reset-submit-btn" onclick="handleResetPassword()">Reset password</button>
    </div>

    <div id="reset-invalid" style="display:none;text-align:center;">
      <p style="font-size:2rem;margin:0 0 0.5rem;">⚠️</p>
      <p class="auth-sub">This reset link is invalid or has expired.</p>
      <button class="btn-submit" onclick="window.location.href='ForgotPassword.html'">Request a new link</button>
    </div>

    <div id="reset-success" style="display:none;text-align:center;">
      <p style="font-size:2rem;margin:0 0 0.5rem;">✅</p>
      <p class="auth-sub">Your password has been updated. Redirecting you to log in…</p>
    </div>

    <div class="auth-switch" style="margin-top:0.75rem">
      Remembered it after all? <a onclick="window.location.href='Login.html'">Log in</a>
    </div>
  </div>
  <div id="toast" class="toast">
    <span id="toast-msg"></span>
  </div>
</div>

<script src="./js/ResetPassword.js"></script>
</body>
</html>
