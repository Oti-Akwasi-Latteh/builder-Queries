<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password – BuilderQueries</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./Css/Login.css">
</head>
<body>

<!-- ═══════════════════════ FORGOT PASSWORD PAGE ═══════════════════════ -->
<div id="page-forgot" class="page">
  <span class="auth-logo">Builder<span>Queries</span></span>
  <div class="auth-card">
    <span class="back-link" onclick="window.location.href='Login.html'">← Back to login</span>
    <h2>Forgot your password?</h2>
    <p class="auth-sub">Enter the email on your account and we'll send you a link to reset it.</p>

    <div id="forgot-form">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" placeholder="john@example.com" id="forgot-email" />
      </div>

      <button class="btn-submit" id="forgot-submit-btn" onclick="handleForgotPassword()">Send reset link</button>
    </div>

    <div id="forgot-success" style="display:none;text-align:center;">
      <p style="font-size:2rem;margin:0 0 0.5rem;">📬</p>
      <p class="auth-sub" style="margin-bottom:0;">If an account exists for that email, a password reset link is on its way. Check your inbox (and spam folder).</p>
    </div>

    <div class="auth-switch" style="margin-top:0.75rem">
      Remembered your password? <a onclick="window.location.href='Login.html'">Log in</a>
    </div>
  </div>
  <div id="toast" class="toast">
    <span id="toast-msg"></span>
  </div>
</div>

<script src="./js/ForgotPassword.js"></script>
</body>
</html>
